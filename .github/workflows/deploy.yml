name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Requires two repo secrets, set under Settings → Secrets and variables → Actions:
      #   CLOUDFLARE_API_TOKEN   — a token with "Cloudflare Pages: Edit" permission
      #   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account ID
      # Create the Pages project once (`npx wrangler pages project create <name>`,
      # or via the dashboard) before the first run, and update `projectName` below.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: baked-peach
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
