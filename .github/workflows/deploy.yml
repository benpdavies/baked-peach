name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Astro caches every resized image in node_modules/.astro, so restoring it
      # means only new or changed photos get processed. Restored after `npm ci`,
      # which wipes node_modules. The key changes whenever the photos do, so a
      # fresh cache is saved after each photo change.
      - name: Cache optimised images
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/assets/photos/**', 'package-lock.json') }}
          restore-keys: astro-images-

      - name: Build
        run: npm run build

      # Requires two repo secrets, set under Settings → Secrets and variables → Actions:
      #   CLOUDFLARE_API_TOKEN   — a token with "Cloudflare Pages: Edit" permission
      #   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account ID
      # Create the Pages project once (`npx wrangler pages project create <name>`,
      # or via the dashboard) before the first run, and update `projectName` below.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: baked-peach
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
